<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>You're on the list · Bleuye</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1739C9}a:hover{color:#0B1A2A}
input::placeholder{color:#8E9AC4}
@keyframes float{50%{transform:translateY(-7px)}}
@keyframes swim{50%{transform:translate(-14px,6px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:.6}100%{transform:translateY(-120px);opacity:0}}
.fl{animation:float 6s ease-in-out infinite}
.fl2{animation:float 7s ease-in-out -2s infinite}
.swim{animation:swim 14s ease-in-out infinite}
.bub{animation:rise 9s linear infinite}
.bub2{animation:rise 11s linear -4s infinite}
.bub3{animation:rise 13s linear -7s infinite}
@media (prefers-reduced-motion:reduce){.fl,.fl2,.swim,.bub,.bub2,.bub3{animation:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 16s linear infinite;transform-origin:50% 50%}
.lg-in::placeholder{color:#8E9AC4}
details.faq{border:1px solid #C9D4F2;border-radius:14px;background:#FFFFFF;padding:0 22px}
details.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;font-weight:600;font-size:17px;color:#0B1A2A}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary span{color:#1739C9;font-size:20px;transition:transform .3s}
details.faq[open] summary span{transform:rotate(45deg)}
details.faq p{margin:0 0 20px;color:#5E6B78;line-height:1.55}
.svc:hover{transform:translateY(-6px)}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

*,*::before,*::after{box-sizing:border-box}
select option{color:#0B1A2A;background:#FFFFFF}
.dot{height:8px;width:8px;border:0;border-radius:999px;cursor:pointer;padding:0;background:#C3CBE0;transition:all .3s}
.dot[aria-current="true"]{width:28px;background:#1739C9}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #9DB8FF;outline-offset:2px}
@media (max-width:900px){[data-chip]{display:none}}

.typing{align-self:flex-start;background:#FFFFFF;border-radius:18px 18px 18px 6px;padding:13px 16px;display:flex;gap:5px}
.typing i{width:7px;height:7px;border-radius:9px;background:#8E9AC4;animation:tdot 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@media (prefers-reduced-motion:no-preference){#thread .msg.hide{display:none}#thread .msg.pop{animation:pop .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}}

@media (prefers-reduced-motion:no-preference){
.rv{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
.rv-l{transform:translateX(-48px)}.rv-r{transform:translateX(48px)}
.hero-in{animation:heroIn 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0ms)}
@keyframes heroIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.pc{transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .7s ease;transition-delay:var(--d,0ms);transform-box:fill-box}
.hx{transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.3,1.4,.5,1),opacity .4s;transition-delay:var(--d,0ms)}
}
</style>
