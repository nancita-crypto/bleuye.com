<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Log in · Bleuye demo</title><link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;font-family:Figtree,sans-serif;color:#0B1A2A;background:linear-gradient(180deg,#1E3FB8 0%,#0F2470 40%,#050B2E 100%)}
.card{width:100%;max-width:400px;background:#FFFFFF;border-radius:24px;padding:32px 28px;display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 80px rgba(5,11,46,.45)}
.card img{height:30px;width:auto;align-self:flex-start}
h1{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:30px;line-height:1.05;letter-spacing:-.03em}
p{margin:0;color:#5E6B78;font-size:15px;line-height:1.5}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
input{font:500 15px Figtree,sans-serif;color:#0B1A2A;border:1px solid #C9D4F2;border-radius:12px;padding:12px 14px;background:#FFFFFF}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #9DB8FF;outline-offset:2px}
button{font:600 15px Figtree,sans-serif;color:#FFFFFF;background:#1739C9;border:0;border-radius:12px;padding:13px 18px;cursor:pointer}
button:hover{background:#0F2470}
.err{min-height:20px;color:#B42318;font-size:14px;font-weight:600}
.back{font-size:14px;color:#1739C9;text-decoration:none}
.back:hover{color:#0B1A2A}
</style></head><body>
<form class="card" id="login" novalidate>
  <a href="index.html" aria-label="Bleuye home"><img src="bleuye-logo-blue.png" alt="Bleuye"></a>
  <h1>Log in to view demo</h1>
  <p>See Bleuye's validation platform as a plug-in inside a pharmacy's store admin.</p>
  <label>Username<input id="u" name="username" autocomplete="username" required></label>
  <label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
  <div class="err" id="err" role="alert"></div>
  <button type="submit">Log in</button>
  <a class="back" href="index.html">← Back to bleuye.com</a>
</form>
<script>
(function(){
  var KEY='2ac7ef376c9eb0428b9140d6a1347a4b63c3b76085eb4c324fdca1132fe8b483';
  function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,'0')}).join('')}
  document.getElementById('login').addEventListener('submit',function(e){
    e.preventDefault();
    var u=document.getElementById('u').value.trim(), p=document.getElementById('p').value, err=document.getElementById('err');
    crypto.subtle.digest('SHA-256',new TextEncoder().encode(u+':'+p)).then(function(h){
      if(hex(h)!==KEY){err.textContent='That username or password doesn’t match.';return;}
      try{sessionStorage.setItem('bleuye-demo','1')}catch(_){}
      location.href='demos.html';
    });
  });
})();
</script>
</body></html>
